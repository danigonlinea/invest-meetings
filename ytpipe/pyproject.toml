[project]
name = "ytpipe"
version = "0.1.0"
description = "Download a YouTube transcript and write a meeting folder with text and structured JSON."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["yt-dlp>=2025.1.1"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
ytpipe = "ytpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytpipe"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]